name: control-plane regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-free:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Run mandatory regression layer
        run: bash scripts/test-ci.sh
