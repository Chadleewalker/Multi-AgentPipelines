# Pipeline allowlist proxy, Codex profile (DESIGN.md 4.8, 6.5): deny-by-default,
# CONNECT-only, TLS passthrough (no ssl_bump anywhere in this file - that is the point).
# Identical policy to the Claude profile; only the allowlist beside it differs, and the
# two are separate images precisely so neither can be widened into both.

http_port 3128
visible_hostname pipeline-proxy-codex

# Only TLS tunnels (CONNECT to 443) to explicitly allowlisted domains.
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed dstdomain "/etc/squid/allowlist.txt"

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed
http_access deny all

# No caching. Access log to squid's log dir (writeable by the 'proxy' user);
# read it with: docker exec <this run's proxy container> tail /var/log/squid/access.log
# (denied egress shows up there as TCP_DENIED - useful for auditing).
cache deny all
access_log stdio:/var/log/squid/access.log
